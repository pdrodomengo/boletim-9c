<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital - 9º Ano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho do Boletim -->
        <header class="cabecalho">
            <h1>Boletim Digital</h1>
            <p class="subtitulo">9º Ano — Estudante Exemplo</p>
        </header>

        <!-- Área Superior: Cards de Resumo -->
        <section class="cards-resumo">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="card-media-geral" class="valor-card">—</p>
            </div>
            
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="card-total-faltas" class="valor-card">—</p>
            </div>

            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="card-bom-desempenho" class="valor-card">—</p>
            </div>

            <div class="card">
                <h3>Atenção</h3>
                <p id="card-atencao" class="valor-card">—</p>
            </div>

            <div class="card">
                <h3>Frequência</h3>
                <p id="card-frequencia" class="valor-card">92%</p>
                <small>Frequência adequada</small>
            </div>
        </section>

        <!-- Tabela de Disciplinas -->
        <section class="secao-tabela">
            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Disciplina</th>
                            <th>1º Tri</th>
                            <th>2º Tri</th>
                            <th>3º Tri</th>
                            <th>Média</th>
                            <th>Faltas</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">
                        <!-- As 15 disciplinas serão inseridas aqui automaticamente pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Conexão com o arquivo de script JavaScript -->
    <script src="script.js"></script>
</body>
</html>
